name: Publish to ECR

# Builds this repo's Dockerfile and pushes the image to our AWS ECR repository
# (disrupt-apps-homepage), so the separate disrupt-apps-homepage Terraform repo
# can deploy a specific SHA-tagged image to Kubernetes.

on:
  push:
    branches:
      - dev
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - ".dockerignore"
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "next.config.js"
      - "next-i18next.config.js"
      - "postcss.config.js"
      - "tailwind.config.js"
      - ".github/workflows/ecr-publish.yml"
  workflow_dispatch: {}

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: disrupt-apps-homepage

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Docker image
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "sha_tag=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
